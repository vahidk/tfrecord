name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tensorflow: [false, true]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[torch]

      - name: Install TensorFlow for interoperability tests
        if: matrix.tensorflow
        run: python -m pip install tensorflow

      - name: Run tests
        run: |
          python run_tests.py

      - name: Test pure-Python protobuf runtime
        env:
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        run: python -m unittest discover -s tests -p test_protobuf_compatibility.py
